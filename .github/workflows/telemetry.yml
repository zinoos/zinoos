name: telemetry

on:
  schedule:
    - cron: "17 4 * * *" # every morning, before the moon phase goes stale
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/telemetry.yml]

permissions:
  contents: write

concurrency:
  group: telemetry
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render ascii scenes
        run: python3 scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "telemetry: $(date -u +%F)" && git push
